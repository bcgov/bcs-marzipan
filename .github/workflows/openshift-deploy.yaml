name: Deploy to OpenShift

permissions:
  contents: read
on:
  push:
    branches:
      - corpcal-openshift-changes

jobs:
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    # Prevent jobs from hanging indefinitely
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Check linting and types
        run: npm run lint:check

      # Security audit: check for known vulnerabilities in dependencies
      - name: Run npm audit
        run: npm audit --audit-level=moderate

      - name: Build project
        run: npm run build

      - name: Run tests
        run: npm run test

  deploy:
    name: Deploy to OpenShift Dev
    needs: quality-checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install oc CLI
        run: |
          curl -L https://mirror.openshift.com/pub/openshift-v4/clients/oc/latest/linux/oc.tar.gz | tar xz
          sudo mv oc /usr/local/bin/

      - name: Login to OpenShift
        run: |
          oc login \
            --token=${{ secrets.OPENSHIFT_TOKEN }} \
            --server=${{ secrets.OPENSHIFT_SERVER }} \
            --insecure-skip-tls-verify=true

      - name: Set project
        run: oc project ${{ secrets.OPENSHIFT_NAMESPACE }}

      - name: Start binary build
        run: |
          oc start-build calendar-service-build \
            --from-dir=. \
            --follow \
            --commit=$(git rev-parse HEAD)

      - name: Start binary build
        run: |
          oc start-build calendar-ui-build \
            --from-dir=. \
            --follow \
            --commit=$(git rev-parse HEAD)
