name: k6 performance
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'API BASE_URL (e.g. https://calendar-api.example.com or http://host:3000/api)'
        required: true
        type: string
      profile:
        description: 'PERF_PROFILE'
        required: false
        default: smoke
        type: choice
        options:
          - smoke
          - standard
      username:
        description: 'PERF_USERNAME (mock login; default seeded admin)'
        required: false
        default: thomas.garcia
        type: string

jobs:
  k6-smoke:
    name: k6 run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Validate k6 scripts (syntax / options)
        run: npm run perf:k6:inspect

      - name: Run k6 against configured target
        env:
          BASE_URL: ${{ github.event.inputs.base_url }}
          PERF_PROFILE: ${{ github.event.inputs.profile }}
          PERF_USERNAME: ${{ github.event.inputs.username }}
          PERF_PASSWORD: ${{ secrets.PERF_PASSWORD }}
          API_KEY: ${{ secrets.PERF_API_KEY }}
        run: k6 run performance_tests/tests/corpcal-api.js
