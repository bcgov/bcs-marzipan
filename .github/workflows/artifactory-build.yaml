name: Artifactory Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build from
        required: false
        type: string
      artifactory_image_repo:
        description: Artifactory image repository to push to
        required: false
        type: string
      target_environment:
        description: Target environment for the build summary
        required: false
        type: string
      image_tag:
        description: Image tag to build and push
        required: false
        type: string
  workflow_call:
    inputs:
      ref:
        description: Git ref to build from
        required: false
        type: string
      artifactory_image_repo:
        description: Artifactory image repository to push to
        required: true
        type: string
      target_environment:
        description: Target environment for the build summary
        required: false
        type: string
      image_tag:
        description: Image tag to build and push
        required: false
        type: string

permissions:
  contents: read

env:
  REGISTRY: ${{ vars.ARTIFACTORY_REGISTRY }}
  ARTIFACTORY_DEV_IMAGE_REPO: ${{ vars.ARTIFACTORY_DEV_IMAGE_REPO }}
  ARTIFACTORY_TEST_IMAGE_REPO: ${{ vars.ARTIFACTORY_TEST_IMAGE_REPO }}
  ARTIFACTORY_PROD_IMAGE_REPO: ${{ vars.ARTIFACTORY_PROD_IMAGE_REPO }}
  APP_VERSION: ${{ vars.APP_VERSION }}
  BUILD_REF: ${{ inputs.ref || github.ref_name }}

jobs:
  artifactory-build:
    name: Artifactory Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}

      - name: Validate Artifactory configuration
        run: |
          if [[ -z "$REGISTRY" ]]; then
            echo "::error::Set repo variable ARTIFACTORY_REGISTRY"
            exit 1
          fi

          ARTIFACTORY_IMAGE_REPO="${{ inputs.artifactory_image_repo }}"
          if [[ -z "$ARTIFACTORY_IMAGE_REPO" ]]; then
            ARTIFACTORY_IMAGE_REPO="$ARTIFACTORY_DEV_IMAGE_REPO"
          fi

          if [[ -z "$ARTIFACTORY_IMAGE_REPO" ]]; then
            echo "::error::Set repo variable ARTIFACTORY_DEV_IMAGE_REPO or pass artifactory_image_repo"
            exit 1
          fi

          if [[ -z "${{ inputs.image_tag || vars.APP_VERSION }}" ]]; then
            echo "::error::Set repo variable APP_VERSION or pass image_tag. SHA fallback is disabled for normal deploy builds to avoid orphaned Artifactory tags."
            exit 1
          fi

          echo "ARTIFACTORY_IMAGE_REPO=$ARTIFACTORY_IMAGE_REPO" >> "$GITHUB_ENV"
          echo "BUILD_IMAGE_TAG=${{ inputs.image_tag || vars.APP_VERSION }}" >> "$GITHUB_ENV"

      - name: Login to Artifactory
        run: |
          echo "${{ secrets.ARTIFACTORY_PASSWORD }}" | \
            docker login "$REGISTRY" \
              -u "${{ secrets.ARTIFACTORY_USERNAME }}" --password-stdin

      - name: Promote tested images to prod repo
        if: ${{ inputs.target_environment == 'prod' }}
        run: |
          set -euo pipefail
          if [[ -z "$ARTIFACTORY_TEST_IMAGE_REPO" ]]; then
            echo "::error::ARTIFACTORY_TEST_IMAGE_REPO is required when promoting to prod."
            exit 1
          fi

          for image in \
            corpcal-service \
            corpcal-ui \
            corpcal-db-migrate \
            corpcal-db-seed; do
            source_ref="$REGISTRY/$ARTIFACTORY_TEST_IMAGE_REPO/$image:$BUILD_IMAGE_TAG"
            target_ref="$REGISTRY/$ARTIFACTORY_IMAGE_REPO/$image:$BUILD_IMAGE_TAG"

            echo "Pulling $source_ref"
            docker pull "$source_ref"

            echo "Retagging $source_ref -> $target_ref"
            docker tag "$source_ref" "$target_ref"

            echo "Pushing $target_ref"
            docker push "$target_ref"
          done

      - name: Build calendar-service
        if: ${{ inputs.target_environment != 'prod' }}
        run: |
          docker build \
            -f calendar-service/Dockerfile \
            -t "$REGISTRY/$ARTIFACTORY_IMAGE_REPO/corpcal-service:$BUILD_IMAGE_TAG" \
            .

      - name: Build calendar-ui
        if: ${{ inputs.target_environment != 'prod' }}
        run: |
          docker build \
            --build-arg APP_VERSION="$BUILD_IMAGE_TAG" \
            -f calendar-ui/Dockerfile \
            -t "$REGISTRY/$ARTIFACTORY_IMAGE_REPO/corpcal-ui:$BUILD_IMAGE_TAG" \
            .

      - name: Build DB migrate job
        if: ${{ inputs.target_environment != 'prod' }}
        run: |
          docker build \
            -f Dockerfile.migrate \
            -t "$REGISTRY/$ARTIFACTORY_IMAGE_REPO/corpcal-db-migrate:$BUILD_IMAGE_TAG" \
            .

      - name: Build DB seed job
        if: ${{ inputs.target_environment != 'prod' }}
        run: |
          docker build \
            -f Dockerfile.seed \
            -t "$REGISTRY/$ARTIFACTORY_IMAGE_REPO/corpcal-db-seed:$BUILD_IMAGE_TAG" \
            .

      - name: Push calendar-service
        if: ${{ inputs.target_environment != 'prod' }}
        run: docker push "$REGISTRY/$ARTIFACTORY_IMAGE_REPO/corpcal-service:$BUILD_IMAGE_TAG"

      - name: Push calendar-ui
        if: ${{ inputs.target_environment != 'prod' }}
        run: docker push "$REGISTRY/$ARTIFACTORY_IMAGE_REPO/corpcal-ui:$BUILD_IMAGE_TAG"

      - name: Push DB migrate job
        if: ${{ inputs.target_environment != 'prod' }}
        run: docker push "$REGISTRY/$ARTIFACTORY_IMAGE_REPO/corpcal-db-migrate:$BUILD_IMAGE_TAG"

      - name: Push DB seed job
        if: ${{ inputs.target_environment != 'prod' }}
        run: docker push "$REGISTRY/$ARTIFACTORY_IMAGE_REPO/corpcal-db-seed:$BUILD_IMAGE_TAG"

      - name: Summary
        run: |
          echo "## Build Results" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Registry:** ${{ env.REGISTRY }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image repo:** $ARTIFACTORY_IMAGE_REPO" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tag:** $BUILD_IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Branch:** $BUILD_REF" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ inputs.target_environment }}" == "prod" ]]; then
            echo "- **Promotion mode:** retag from test repo to prod repo" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Promotion mode:** rebuild and push from source" >> "$GITHUB_STEP_SUMMARY"
          fi
