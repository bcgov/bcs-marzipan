name: Artifactory Build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ${{ vars.ARTIFACTORY_REGISTRY }}
  ARTIFACTORY_DEV_IMAGE_REPO: ${{ vars.ARTIFACTORY_DEV_IMAGE_REPO }}
  APP_VERSION: ${{ vars.APP_VERSION }}

jobs:
  artifactory-build:
    name: Artifactory Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate Artifactory configuration
        run: |
          if [[ -z "$REGISTRY" ]]; then
            echo "::error::Set repo variable ARTIFACTORY_REGISTRY"
            exit 1
          fi

          if [[ -z "$ARTIFACTORY_DEV_IMAGE_REPO" ]]; then
            echo "::error::Set repo variable ARTIFACTORY_DEV_IMAGE_REPO"
            exit 1
          fi

          if [[ -z "$APP_VERSION" ]]; then
            echo "::error::Set repo variable APP_VERSION"
            exit 1
          fi

      - name: Login to Artifactory
        run: |
          echo "${{ secrets.ARTIFACTORY_PASSWORD }}" | \
            docker login "$REGISTRY" \
              -u "${{ secrets.ARTIFACTORY_USERNAME }}" --password-stdin

      - name: Build calendar-service
        run: |
          docker build \
            -f calendar-service/Dockerfile \
            -t "$REGISTRY/$ARTIFACTORY_DEV_IMAGE_REPO/calendar-service:$APP_VERSION" \
            .

      - name: Build calendar-ui
        run: |
          docker build \
            -f calendar-ui/Dockerfile \
            -t "$REGISTRY/$ARTIFACTORY_DEV_IMAGE_REPO/calendar-ui:$APP_VERSION" \
            .

      - name: Push calendar-service
        run: docker push "$REGISTRY/$ARTIFACTORY_DEV_IMAGE_REPO/calendar-service:$APP_VERSION"

      - name: Push calendar-ui
        run: docker push "$REGISTRY/$ARTIFACTORY_DEV_IMAGE_REPO/calendar-ui:$APP_VERSION"

      - name: Summary
        run: |
          echo "## Build Results" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Registry:** ${{ env.REGISTRY }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image repo:** ${{ env.ARTIFACTORY_DEV_IMAGE_REPO }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tag:** ${{ env.APP_VERSION }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Branch:** ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
