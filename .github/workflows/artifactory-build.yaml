name: Artifactory Build

on:
  workflow_dispatch:
    inputs:
      artifactory_image_repo:
        description: 'Artifactory image repo path (e.g. dev, test, prod repo)'
        required: false
        type: string
      target_environment:
        description: "Target environment (dev, test, prod). When 'prod', retagging existing test images instead of rebuilding."
        required: false
        type: choice
        options:
          - dev
          - test
          - prod
  workflow_call:
    inputs:
      artifactory_image_repo:
        description: 'Artifactory image repo path (e.g. dev, test, prod repo)'
        required: false
        type: string
      target_environment:
        description: "Target environment (dev, test, prod). When 'prod', retagging existing test images instead of rebuilding."
        required: false
        type: string

permissions:
  contents: read

env:
  REGISTRY: ${{ vars.ARTIFACTORY_REGISTRY }}
  ARTIFACTORY_IMAGE_REPO: ${{ inputs.artifactory_image_repo || vars.ARTIFACTORY_DEV_IMAGE_REPO }}
  ARTIFACTORY_TEST_IMAGE_REPO: ${{ vars.ARTIFACTORY_TEST_IMAGE_REPO }}
  APP_VERSION: ${{ vars.APP_VERSION }}

jobs:
  artifactory-build:
    name: Artifactory Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate Artifactory configuration
        run: |
          if [[ -z "$REGISTRY" ]]; then
            echo "::error::Set repo variable ARTIFACTORY_REGISTRY"
            exit 1
          fi

          if [[ -z "$ARTIFACTORY_IMAGE_REPO" ]]; then
            echo "::error::Provide input artifactory_image_repo or set repo variable ARTIFACTORY_DEV_IMAGE_REPO"
            exit 1
          fi

          if [[ "${{ inputs.target_environment }}" == "prod" && -z "$ARTIFACTORY_TEST_IMAGE_REPO" ]]; then
            echo "::error::Set repo variable ARTIFACTORY_TEST_IMAGE_REPO (source for prod promotion)"
            exit 1
          fi

          if [[ -z "$APP_VERSION" ]]; then
            echo "::error::Set repo variable APP_VERSION"
            exit 1
          fi

      - name: Login to Artifactory
        run: |
          echo "${{ secrets.ARTIFACTORY_PASSWORD }}" | \
            docker login "$REGISTRY" \
              -u "${{ secrets.ARTIFACTORY_USERNAME }}" --password-stdin

      - name: Build calendar-service
        if: inputs.target_environment != 'prod'
        run: |
          docker build \
            -f calendar-service/Dockerfile \
            -t "$REGISTRY/$ARTIFACTORY_IMAGE_REPO/calendar-service:$APP_VERSION" \
            .

      - name: Build calendar-ui
        if: inputs.target_environment != 'prod'
        run: |
          docker build \
            -f calendar-ui/Dockerfile \
            -t "$REGISTRY/$ARTIFACTORY_IMAGE_REPO/calendar-ui:$APP_VERSION" \
            .

      - name: Promote calendar-service (test -> prod)
        if: inputs.target_environment == 'prod'
        run: |
          docker pull "$REGISTRY/$ARTIFACTORY_TEST_IMAGE_REPO/calendar-service:$APP_VERSION"
          docker tag \
            "$REGISTRY/$ARTIFACTORY_TEST_IMAGE_REPO/calendar-service:$APP_VERSION" \
            "$REGISTRY/$ARTIFACTORY_IMAGE_REPO/calendar-service:$APP_VERSION"

      - name: Promote calendar-ui (test -> prod)
        if: inputs.target_environment == 'prod'
        run: |
          docker pull "$REGISTRY/$ARTIFACTORY_TEST_IMAGE_REPO/calendar-ui:$APP_VERSION"
          docker tag \
            "$REGISTRY/$ARTIFACTORY_TEST_IMAGE_REPO/calendar-ui:$APP_VERSION" \
            "$REGISTRY/$ARTIFACTORY_IMAGE_REPO/calendar-ui:$APP_VERSION"

      - name: Push calendar-service
        run: docker push "$REGISTRY/$ARTIFACTORY_IMAGE_REPO/calendar-service:$APP_VERSION"

      - name: Push calendar-ui
        run: docker push "$REGISTRY/$ARTIFACTORY_IMAGE_REPO/calendar-ui:$APP_VERSION"

      - name: Summary
        run: |
          echo "## Build Results" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ inputs.target_environment }}" == "prod" ]]; then
            echo "- **Mode:** Promote (retag from test — no rebuild)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Source (test) repo:** ${{ env.ARTIFACTORY_TEST_IMAGE_REPO }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Mode:** Build and push" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- **Registry:** ${{ env.REGISTRY }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Target image repo:** ${{ env.ARTIFACTORY_IMAGE_REPO }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tag:** ${{ env.APP_VERSION }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Branch:** ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tag:** ${{ env.APP_VERSION }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Branch:** ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
