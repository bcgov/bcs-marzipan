name: Promote to Emerald GitOps

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Target Emerald environment overlay to update
        required: true
        type: choice
        options:
          - dev
          - test
          - prod
      image_tag:
        description: Image tag to promote (defaults to APP_VERSION variable, else short SHA)
        required: false
        type: string
  workflow_call:
    inputs:
      target_environment:
        description: Target Emerald environment overlay to update
        required: true
        type: string
      image_tag:
        description: Image tag to promote (defaults to APP_VERSION variable, else short SHA)
        required: false
        type: string

jobs:
  update-gitops-overlay:
    name: Update GitOps Overlay Tag
    runs-on: ubuntu-latest
    concurrency:
      group: promote-emerald-gitops-${{ inputs.target_environment }}
      cancel-in-progress: false
    env:
      # Required repo variable, format: owner/repo
      GITOPS_REPO: ${{ vars.GITOPS_REPO }}
      # Optional repo variable; defaults to main when not set
      GITOPS_BASE_BRANCH: ${{ vars.GITOPS_BASE_BRANCH }}
      # Required repo variables with file paths in your GitOps repo
      GITOPS_EMERALD_DEV_KUSTOMIZE_PATH: ${{ vars.GITOPS_EMERALD_DEV_KUSTOMIZE_PATH }}
      GITOPS_EMERALD_TEST_KUSTOMIZE_PATH: ${{ vars.GITOPS_EMERALD_TEST_KUSTOMIZE_PATH }}
      GITOPS_EMERALD_PROD_KUSTOMIZE_PATH: ${{ vars.GITOPS_EMERALD_PROD_KUSTOMIZE_PATH }}
      APP_VERSION: ${{ vars.APP_VERSION }}
    steps:
      - name: Validate required configuration
        env:
          GITOPS_REPO_KEY: ${{ secrets.GITOPS_REPO_KEY }}
        run: |
          : "${GITOPS_REPO:?Set repo variable GITOPS_REPO (owner/repo)}"
          : "${GITOPS_EMERALD_DEV_KUSTOMIZE_PATH:?Set repo variable GITOPS_EMERALD_DEV_KUSTOMIZE_PATH}"
          : "${GITOPS_EMERALD_TEST_KUSTOMIZE_PATH:?Set repo variable GITOPS_EMERALD_TEST_KUSTOMIZE_PATH}"
          : "${GITOPS_EMERALD_PROD_KUSTOMIZE_PATH:?Set repo variable GITOPS_EMERALD_PROD_KUSTOMIZE_PATH}"
          : "${GITOPS_REPO_KEY:?Set secret GITOPS_REPO_KEY with access to your GitOps repo}"

      - name: Resolve promotion inputs
        id: resolve_promotion_inputs
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${{ inputs.image_tag }}" ]]; then
            IMAGE_TAG="${{ inputs.image_tag }}"
          elif [[ -n "${APP_VERSION}" ]]; then
            IMAGE_TAG="${APP_VERSION}"
          else
            IMAGE_TAG="${GITHUB_SHA::7}"
          fi

          case "${{ inputs.target_environment }}" in
            dev)
              KUSTOMIZATION_PATH="${GITOPS_EMERALD_DEV_KUSTOMIZE_PATH}"
              ;;
            test)
              KUSTOMIZATION_PATH="${GITOPS_EMERALD_TEST_KUSTOMIZE_PATH}"
              ;;
            prod)
              KUSTOMIZATION_PATH="${GITOPS_EMERALD_PROD_KUSTOMIZE_PATH}"
              ;;
            *)
              echo "Unsupported target environment: ${{ inputs.target_environment }}" >&2
              exit 1
              ;;
          esac

          BASE_BRANCH="${GITOPS_BASE_BRANCH:-main}"
          BRANCH_NAME="chore/emerald-${{ inputs.target_environment }}-promote-${IMAGE_TAG}"

          {
            echo "image_tag=${IMAGE_TAG}"
            echo "kustomization_path=${KUSTOMIZATION_PATH}"
            echo "base_branch=${BASE_BRANCH}"
            echo "branch_name=${BRANCH_NAME}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          ssh-key: ${{ secrets.GITOPS_REPO_KEY }}
          ref: ${{ steps.resolve_promotion_inputs.outputs.base_branch }}
          path: gitops

      - name: Debug GitOps checkout
        run: |
          pwd
          ls -la
          echo "==== gitops directory ===="
          ls -la gitops || true
          echo "==== find kustomization files ===="
          find gitops -name "kustomization.yaml" -o -name "kustomization.yml"

      - name: Install yq
        shell: bash
        run: |
          set -euo pipefail
          YQ_VERSION="v4.44.3"
          sudo wget -qO /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Update image tags in GitOps overlay
        id: update_overlay
        shell: bash
        run: |
          set -euo pipefail

          KUSTOMIZATION_FILE="${{ steps.resolve_promotion_inputs.outputs.kustomization_path }}"
          KUSTOMIZATION_FILE_ABS="gitops/${KUSTOMIZATION_FILE}"
          IMAGE_TAG="${{ steps.resolve_promotion_inputs.outputs.image_tag }}"

          if [[ ! -f "$KUSTOMIZATION_FILE_ABS" ]]; then
            echo "File not found: $KUSTOMIZATION_FILE_ABS" >&2
            exit 1
          fi

          IMAGE_TAG="$IMAGE_TAG" yq -i '
            (.images[] | select(.name == "calendar-service" or .name == "calendar-service:latest").newTag) = strenv(IMAGE_TAG) |
            (.images[] | select(.name == "calendar-ui" or .name == "calendar-ui:latest").newTag) = strenv(IMAGE_TAG) |
            (.images[] | select(.name == "calendar-db-migrate" or .name == "calendar-db-migrate:latest").newTag) = strenv(IMAGE_TAG)
          ' "$KUSTOMIZATION_FILE_ABS"

          if git -C gitops diff --quiet -- "$KUSTOMIZATION_FILE"; then
            echo "No overlay changes were needed for $KUSTOMIZATION_FILE_ABS"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Updated overlay tag(s) in $KUSTOMIZATION_FILE_ABS"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git
        # Bot identity required so the commit has an author; see
        # https://github.com/orgs/community/discussions/26560#discussioncomment-3531273
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/gitops"

      - name: Commit and push to GitOps repository
        if: steps.update_overlay.outputs.changed == 'true'
        run: |
          cd gitops
          git add -- "${{ steps.resolve_promotion_inputs.outputs.kustomization_path }}"
          git commit -m "chore(gitops): promote emerald ${{ inputs.target_environment }} to ${{ steps.resolve_promotion_inputs.outputs.image_tag }}"
          git push --force-with-lease origin ${{ steps.resolve_promotion_inputs.outputs.base_branch }}
      - name: Summary
        run: |
          echo "Target environment : ${{ inputs.target_environment }}"
          echo "Image tag          : ${{ steps.resolve_promotion_inputs.outputs.image_tag }}"
          echo "Overlay file       : ${{ steps.resolve_promotion_inputs.outputs.kustomization_path }}"
          echo "Changes pushed     : ${{ steps.update_overlay.outputs.changed }}"
