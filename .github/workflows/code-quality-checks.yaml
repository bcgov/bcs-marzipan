name: Code quality checks
permissions:
  contents: read
on:
  push:
    branches: [main]
jobs:
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    # Prevent jobs from hanging indefinitely
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Build project
        run: npm run build

      - name: Check linting and types
        run: npm run check

      # Security audit: check for known vulnerabilities in dependencies
      - name: Run npm audit
        run: npm audit --audit-level=critical
        continue-on-error: true

      - name: Run tests
        run: npm run test

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Validate k6 performance scripts
        run: npm run perf:k6:inspect
