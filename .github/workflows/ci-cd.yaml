name: CI/CD
permissions:
  contents: read
on:
  push:
    branches: [main]
jobs:
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    # Prevent jobs from hanging indefinitely
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Build project
        run: npm run build

      - name: Check linting and types
        run: npm run check

      # Security audit: check for known vulnerabilities in dependencies
      - name: Run npm audit
        # Note: we have to temporarily raise this to build until eslint updates to ajv >8.18.0
        # TODO: return to moderate asap
        # https://github.com/eslint/eslint/issues/20508
        run: npm audit --audit-level=high

      - name: Run tests
        run: npm run test

