name: Code quality (reusable)

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out (branch, tag, or SHA)
        required: false
        type: string

jobs:
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run verify
        run: npm run verify

      - name: Run npm audit
        run: npm audit --audit-level=critical
        continue-on-error: true
