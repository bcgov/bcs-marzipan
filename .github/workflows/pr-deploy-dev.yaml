name: Deploy to OpenShift

permissions:
  contents: read
on:
  push:
    branches:
      - feat/CORPCAL-95-openshift-db-migration-scripts

jobs:
  deploy:
    name: Deploy to OpenShift Dev
    runs-on: ubuntu-latest
    environment: dev-gold
    env:
      OPENSHIFT_SERVER: ${{ secrets.OPENSHIFT_SERVER }}
      OPENSHIFT_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
      TOOLS_NAMESPACE: ${{ secrets.OPENSHIFT_TOOLS_NAMESPACE }}
      DEV_NAMESPACE: ${{ secrets.OPENSHIFT_DEV_NAMESPACE }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install oc CLI
        run: |
          curl -L https://mirror.openshift.com/pub/openshift-v4/clients/oc/latest/linux/oc.tar.gz | tar xz
          sudo mv oc /usr/local/bin/

      - name: Install envsubst
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext-base

      - name: Login to OpenShift
        run: |
          oc login \
            --token=${OPENSHIFT_TOKEN} \
            --server=${OPENSHIFT_SERVER} \
            --insecure-skip-tls-verify=true

      - name: Apply build resources in tools namespace
        run: |
          oc project ${TOOLS_NAMESPACE}
          oc kustomize openshift/overlays/tools | envsubst | oc apply -f -

      - name: Start binary build (calendar-service)
        run: |
          oc start-build calendar-service-build \
            --from-dir=. \
            --follow \
            --commit=$(git rev-parse HEAD)
          oc tag ${TOOLS_NAMESPACE}/calendar-service:latest ${DEV_NAMESPACE}/calendar-service:latest

      - name: Start binary build (calendar-ui)
        run: |
          oc start-build calendar-ui-build \
            --from-dir=. \
            --follow \
            --commit=$(git rev-parse HEAD)
          oc tag ${TOOLS_NAMESPACE}/calendar-ui:latest ${DEV_NAMESPACE}/calendar-ui:latest

      - name: Deploy to Dev environment
        run: |
          oc project ${DEV_NAMESPACE}
          oc kustomize openshift/overlays/dev | envsubst | oc apply -f -
          oc rollout restart deployment/calendar-service
          oc rollout restart deployment/calendar-ui
