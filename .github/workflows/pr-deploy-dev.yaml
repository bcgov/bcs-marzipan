name: Deploy to OpenShift

permissions:
  contents: read
on:
  push:
    branches:
      - develop

jobs:
  deploy:
    name: Deploy to OpenShift Dev
    runs-on: ubuntu-latest
    environment: dev-silver
    env:
      OPENSHIFT_SERVER: ${{ secrets.OPENSHIFT_SERVER }}
      OPENSHIFT_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
      TOOLS_NAMESPACE: ${{ secrets.OPENSHIFT_TOOLS_NAMESPACE }}
      DEV_NAMESPACE: ${{ secrets.OPENSHIFT_DEV_NAMESPACE }}
      APP_VERSION: ${{ vars.APP_VERSION }}
      GIT_REF: develop
      NODE_ENV: development
      CORS_ALLOWED_ORIGINS: 'https://calendar-ui-d8b00f-dev.apps.silver.devops.gov.bc.ca,https://calendar-ui-b3237c-dev.apps.gold.devops.gov.bc.ca,http://localhost:3000,http://localhost:4173,http://localhost:8080'
      AUTH_COOKIE_DOMAIN: ${{ vars.AUTH_COOKIE_DOMAIN }}
      POST_LOGIN_REDIRECT_URL: ${{ vars.POST_LOGIN_REDIRECT_URL }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_REDIRECT_URI: ${{ secrets.AZURE_REDIRECT_URI }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install oc CLI
        run: |
          curl -L https://mirror.openshift.com/pub/openshift-v4/clients/oc/latest/linux/oc.tar.gz | tar xz
          sudo mv oc /usr/local/bin/

      - name: Install envsubst
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext-base

      - name: Login to OpenShift
        run: |
          oc login \
            --token=${OPENSHIFT_TOKEN} \
            --server=${OPENSHIFT_SERVER} \
            --insecure-skip-tls-verify=true

      - name: Apply build resources in tools namespace
        run: |
          export APP_VERSION="${{ vars.APP_VERSION }}"
          oc project ${TOOLS_NAMESPACE}
          oc kustomize openshift/build | envsubst | oc apply -f -

      - name: Start binary build (calendar-service)
        run: |
          export APP_VERSION="${{ vars.APP_VERSION }}"
          oc start-build calendar-service-build \
            --from-dir=. \
            --follow \
            --commit=$(git rev-parse HEAD)
          oc tag ${TOOLS_NAMESPACE}/calendar-service:${APP_VERSION} ${DEV_NAMESPACE}/calendar-service:${APP_VERSION}

      - name: Start binary build (calendar-ui)
        run: |
          export APP_VERSION="${{ vars.APP_VERSION }}"
          oc start-build calendar-ui-build \
            --from-dir=. \
            --follow \
            --commit=$(git rev-parse HEAD)
          oc tag ${TOOLS_NAMESPACE}/calendar-ui:${APP_VERSION} ${DEV_NAMESPACE}/calendar-ui:${APP_VERSION}

      - name: Deploy to Dev environment
        run: |
          export APP_VERSION="${{ vars.APP_VERSION }}"
          oc project ${DEV_NAMESPACE}
          oc kustomize openshift/deploy/overlays/dev | envsubst | oc apply -f -
          oc rollout restart deployment/calendar-service
          oc rollout restart deployment/calendar-ui
