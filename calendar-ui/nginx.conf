server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip for static assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static asset caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Disable caching for index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Runtime feature flags must update immediately after deploys.
    # Do not cache config.js or clients may keep stale values.
    location = /config.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # OpenShift readiness / liveness
    location = /ready {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location = /health {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Socket.IO proxy — Engine.IO uses /socket.io/ by default, not /api/socket.io/.
    # Must be a dedicated location; without it the SPA catch-all serves index.html
    # for every polling/WS request and the handshake never completes.
    location /socket.io/ {
        proxy_pass ${API_PROXY_UPSTREAM}/socket.io/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # API proxy (rendered via envsubst)
    location /api/ {
        proxy_pass ${API_PROXY_UPSTREAM}/;
        proxy_http_version 1.1;

        # Forward WebSocket upgrade headers so Socket.IO can upgrade from HTTP
        # polling to a true WebSocket connection. Without these, nginx drops the
        # hop-by-hop Upgrade header and the handshake never completes.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
