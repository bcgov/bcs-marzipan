apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: calendar-service-build
  labels:
    app.kubernetes.io/name: calendar
    app.kubernetes.io/component: service
    app.kubernetes.io/part-of: corporate-calendar
    app.kubernetes.io/instance: dev
    app.kubernetes.io/managed-by: kubectl
spec:
  source:
    type: Git
    git:
      uri: https://github.com/bcgov/bcs-marzipan.git
      ref: develop
    # Use repository root as build context so Dockerfile can access root files
    # (tsconfig.base.json, package*.json, packages/)
    contextDir: .
  strategy:
    type: Docker
    dockerStrategy:
      # Dockerfile path is relative to the contextDir above
      dockerfilePath: calendar-service/Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: calendar-service:latest
  triggers:
    - type: ConfigChange
