apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base

# Namespace is injected at deploy time by GitHub Actions.
namespace: ${TEST_NAMESPACE}

# Replace default images to the OpenShift internal registry.
images:
  - name: calendar-service:latest
    newName: image-registry.openshift-image-registry.svc:5000/${TEST_NAMESPACE}/calendar-service
    newTag: ${APP_VERSION}
  - name: calendar-ui:latest
    newName: image-registry.openshift-image-registry.svc:5000/${TEST_NAMESPACE}/calendar-ui
    newTag: ${APP_VERSION}

patches:
  - path: patches/calendar-ui-configmap.patch.yaml
