apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base

# Namespace is injected at deploy time by GitHub Actions.
namespace: ${PROD_NAMESPACE}

# Replace images built into the OpenShift internal registry.
images:
  - name: image-registry.openshift-image-registry.svc:5000/${TOOLS_NAMESPACE}/calendar-service
    newName: image-registry.openshift-image-registry.svc:5000/${PROD_NAMESPACE}/calendar-service
    newTag: latest
  - name: image-registry.openshift-image-registry.svc:5000/${TOOLS_NAMESPACE}/calendar-ui
    newName: image-registry.openshift-image-registry.svc:5000/${PROD_NAMESPACE}/calendar-ui
    newTag: latest
