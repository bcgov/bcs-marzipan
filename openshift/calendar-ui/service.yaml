apiVersion: v1
kind: Service
metadata:
  name: calendar-ui
  labels:
    app.kubernetes.io/name: calendar
    app.kubernetes.io/component: ui
    app.kubernetes.io/part-of: corporate-calendar
    app.kubernetes.io/instance: dev
    app.kubernetes.io/managed-by: kubectl
spec:
  selector:
    app: calendar-ui
  ports:
    - protocol: TCP
      port: 8080
      targetPort: http
      name: http
