# Not used as of now, but kept for future reference
apiVersion: batch/v1
kind: Job
metadata:
  name: calendar-db-migrate
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: image-registry.openshift-image-registry.svc:5000/b3237c-dev/calendar-db-migrate:latest
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: calendar-service-secrets
                  key: DATABASE_URL
