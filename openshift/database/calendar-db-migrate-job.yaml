apiVersion: batch/v1
kind: Job
metadata:
  name: calendar-db-migrate
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: image-registry.openshift-image-registry.svc:5000/b3237c-dev/calendar-service:latest
          command:
            - sh
            - -c
            - |
              set -e
              cd /app

              echo "Running DB migrations..."
              npm run db:migrate --workspace=packages/database

              echo "Seeding lookup data..."
              npm run seed --workspace=calendar-service

              echo "DB initialized successfully"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: calendar-service-secrets
                  key: database_url
