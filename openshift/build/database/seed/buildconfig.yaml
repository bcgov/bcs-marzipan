apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: calendar-db-seed-build
  labels:
    app.kubernetes.io/name: calendar
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: corporate-calendar
    app.kubernetes.io/instance: dev
    app.kubernetes.io/managed-by: kubectl
spec:
  source:
    type: Git
    git:
      uri: https://github.com/bcgov/bcs-marzipan.git
      ref: feat/CORPCAL-193-implement-azure-ad
    contextDir: .
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile.seed
  output:
    to:
      kind: ImageStreamTag
      name: calendar-db-seed:${APP_VERSION}
  triggers:
    - type: ConfigChange
