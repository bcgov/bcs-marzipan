apiVersion: apps/v1
kind: Deployment
metadata:
  name: corpcal-service
  labels:
    DataClass: Low #Does not affect directly as such
    app: corpcal-service
    app.kubernetes.io/name: corpcal
    app.kubernetes.io/component: service
    app.kubernetes.io/part-of: corporate-calendar
    app.kubernetes.io/version: ${APP_VERSION}
    app.kubernetes.io/managed-by: github-actions
spec:
  replicas: 1
  selector:
    matchLabels:
      app: corpcal-service
  template:
    metadata:
      labels:
        DataClass: Low
        Internet-Egress: ALLOW
        Internet-Ingress: ALLOW
        app: corpcal-service
    spec:
      containers:
        - name: corpcal-service
          image: corpcal-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              protocol: TCP
              containerPort: 3001
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: corpcal-service-secret
                  key: DATABASE_URL
            - name: CORS_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: corpcal-service-config
                  key: CORS_ALLOWED_ORIGINS
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: corpcal-service-config
                  key: NODE_ENV
            - name: AUTH_STRATEGY
              valueFrom:
                configMapKeyRef:
                  name: corpcal-service-config
                  key: AUTH_STRATEGY
            - name: AUTH_COOKIE_DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: corpcal-service-config
                  key: AUTH_COOKIE_DOMAIN
            - name: POST_LOGIN_REDIRECT_URL
              valueFrom:
                configMapKeyRef:
                  name: corpcal-service-config
                  key: POST_LOGIN_REDIRECT_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: corpcal-service-secret
                  key: JWT_SECRET
            - name: AZURE_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: corpcal-service-secret
                  key: AZURE_TENANT_ID
            - name: AZURE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: corpcal-service-secret
                  key: AZURE_CLIENT_ID
            - name: AZURE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: corpcal-service-secret
                  key: AZURE_CLIENT_SECRET
            - name: AZURE_REDIRECT_URI
              valueFrom:
                secretKeyRef:
                  name: corpcal-service-secret
                  key: AZURE_REDIRECT_URI
            - name: HTTP_PROXY
              value: 'http://swpxkam.gov.bc.ca:8080'
            - name: HTTPS_PROXY
              value: 'http://swpxkam.gov.bc.ca:8080'
            - name: NO_PROXY
              value: '.cluster.local,.svc,10.91.0.0/16,10.93.0.0/16,172.30.0.0/16,127.0.0.1,localhost,.gov.bc.ca'

          readinessProbe:
            httpGet:
              path: /ready
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 20
