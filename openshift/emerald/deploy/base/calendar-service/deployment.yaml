apiVersion: apps/v1
kind: Deployment
metadata:
  name: calendar-service
  labels:
    app: calendar-service
    app.kubernetes.io/name: calendar
    app.kubernetes.io/component: service
    app.kubernetes.io/part-of: corporate-calendar
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: calendar-service
  template:
    metadata:
      labels:
        app: calendar-service
    spec:
      containers:
        - name: calendar-service
          image: calendar-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              protocol: TCP
              containerPort: 3001
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: calendar-service-secrets
                  key: DATABASE_URL
            - name: CORS_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: calendar-service-config
                  key: CORS_ALLOWED_ORIGINS
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: calendar-service-config
                  key: NODE_ENV
            - name: AUTH_STRATEGY
              valueFrom:
                configMapKeyRef:
                  name: calendar-service-config
                  key: AUTH_STRATEGY
            - name: AUTH_COOKIE_DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: calendar-service-config
                  key: AUTH_COOKIE_DOMAIN
            - name: POST_LOGIN_REDIRECT_URL
              valueFrom:
                configMapKeyRef:
                  name: calendar-service-config
                  key: POST_LOGIN_REDIRECT_URL
            - name: RATE_LIMIT_MAX
              valueFrom:
                configMapKeyRef:
                  name: calendar-service-config
                  key: RATE_LIMIT_MAX
            - name: RATE_LIMIT_AUTH_MAX
              valueFrom:
                configMapKeyRef:
                  name: calendar-service-config
                  key: RATE_LIMIT_AUTH_MAX
            - name: RATE_LIMIT_STORE
              valueFrom:
                configMapKeyRef:
                  name: calendar-service-config
                  key: RATE_LIMIT_STORE
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: calendar-service-secrets
                  key: JWT_SECRET
            - name: RATE_LIMIT_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: calendar-service-secrets
                  key: RATE_LIMIT_REDIS_URL
            - name: AZURE_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: calendar-service-secrets
                  key: AZURE_TENANT_ID
            - name: AZURE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: calendar-service-secrets
                  key: AZURE_CLIENT_ID
            - name: AZURE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: calendar-service-secrets
                  key: AZURE_CLIENT_SECRET
            - name: AZURE_REDIRECT_URI
              valueFrom:
                secretKeyRef:
                  name: calendar-service-secrets
                  key: AZURE_REDIRECT_URI
          readinessProbe:
            httpGet:
              path: /ready
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 20
