apiVersion: v1
kind: ConfigMap
metadata:
  name: corpcal-service-config
  labels:
    app.kubernetes.io/name: corpcal
    app.kubernetes.io/component: service
    app.kubernetes.io/part-of: corporate-calendar
    app.kubernetes.io/managed-by: github-actions
data:
  NODE_ENV: production
  AUTH_STRATEGY: azure
  AUTH_COOKIE_DOMAIN: ''
  POST_LOGIN_REDIRECT_URL: ''
  PUBLIC_APP_BASE_URL: ''
  NOTIFICATIONS_EMAIL_ENABLED: 'false'
  NOTIFICATIONS_EMAIL_FROM: ''
  NOTIFICATIONS_SMTP_HOST: 'apps.smtp.gov.bc.ca'
  NOTIFICATIONS_SMTP_PORT: '25'
  NOTIFICATIONS_SMTP_SECURE: ''
  NOTIFICATIONS_EMAIL_SUBJECT_PREFIX: ''
  CORS_ALLOWED_ORIGINS: 'http://localhost:3000,http://localhost:4173,http://localhost:8080'
  RATE_LIMIT_MAX: '200'
  RATE_LIMIT_AUTH_MAX: '5'
  RATE_LIMIT_STORE: memory
