apiVersion: batch/v1
kind: Job
metadata:
  name: corpcal-db-seed-job
  labels:
    app: corpcal-db-seed-job
    app.kubernetes.io/name: corpcal
    app.kubernetes.io/component: seed
    app.kubernetes.io/part-of: corporate-calendar
    app.kubernetes.io/managed-by: github-actions
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: corpcal-db-seed-job
    spec:
      restartPolicy: Never
      containers:
        - name: seed
          image: corpcal-db-seed:latest
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: corpcal-service-secret
                  key: DATABASE_URL
