apiVersion: batch/v1
kind: Job
metadata:
  name: corpcal-db-migrate-job
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: '1'
  labels:
    app: corpcal-db-migrate-job
    app.kubernetes.io/name: corpcal
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: corporate-calendar
    app.kubernetes.io/version: ${APP_VERSION}
    app.kubernetes.io/managed-by: github-actions
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: corpcal-db-migrate-job
        DataClass: Low
        Internet-Ingress: DENY
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: corpcal-db-migrate:latest
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: corpcal-service-secret
                  key: DATABASE_URL
          command:
            - sh
            - -c
            - |
              set -e
              echo "Waiting for database..."
              until pg_isready -d "$DATABASE_URL"; do
                sleep 2
              done
              echo "Running tracked Drizzle migrations..."
              npm run db:migrate --workspace=packages/database

              echo "DB migrations completed successfully."
