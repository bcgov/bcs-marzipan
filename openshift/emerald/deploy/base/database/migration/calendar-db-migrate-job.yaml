apiVersion: batch/v1
kind: Job
metadata:
  name: calendar-db-migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: '1'
  labels:
    app: calendar-db-migrate
    app.kubernetes.io/name: calendar
    app.kubernetes.io/component: job
    app.kubernetes.io/part-of: corporate-calendar
    app.kubernetes.io/instance: dev
    app.kubernetes.io/managed-by: kubectl
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: calendar-db-migrate
        DataClass: Low
        Internet-Ingress: DENY
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: calendar-db-migrate:latest
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: calendar-service-secrets
                  key: DATABASE_URL
          command:
            - sh
            - -c
            - |
              set -e
              echo "Waiting for database..."
              until pg_isready -d "$DATABASE_URL"; do
                sleep 2
              done
              echo "Running tracked Drizzle migrations..."
              npm run db:migrate --workspace=packages/database

              echo "DB migrations completed successfully."
