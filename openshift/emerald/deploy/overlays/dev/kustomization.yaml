apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base

# Namespace is injected at deploy time by GitHub Actions.
namespace: dc4c90-dev

# Replace images built into the OpenShift internal registry.
images:
  - name: calendar-service
    newName: image-registry.openshift-image-registry.svc:5000/dc4c90-dev/calendar-service
    newTag: 0.0.1
  - name: calendar-ui
    newName: image-registry.openshift-image-registry.svc:5000/dc4c90-dev/calendar-ui
    newTag: 0.0.1

patches:
  - path: patches/calendar-service-configmap.patch.yaml
  - path: patches/calendar-ui-configmap.patch.yaml
